server {
    listen 80;
    server_name _;

    # Docker's embedded DNS, so a recreated gateway is picked up within
    # seconds. Without it nginx resolves the name once at startup and keeps
    # talking to the dead container's IP after `docker compose up -d gateway`.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # The client-side router owns every path, so an unknown URL returns the
    # shell and Vue Router renders the 404 view instead of nginx's page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: the browser calls /api and nginx forwards it to the
    # gateway. Because the browser never leaves this origin, the SPA needs no
    # CORS at all - the same arrangement Vite provides in development.
    location /api/ {
        # A variable defers resolution to request time, which is what makes the
        # resolver above take effect.
        set $gateway api-gateway:8000;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite fingerprints every asset, so the name changes when the bytes change.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
