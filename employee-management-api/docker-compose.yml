services:
  redis:
    image: redis:7-alpine
    container_name: employee-management-redis
    # Password required by the app (REDIS_PASSWORD); AOF keeps cached reads
    # warm across restarts, and the volatile-lru policy evicts keys with a TTL
    # before touching anything else when the memory limit is reached.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-wangqi}
      --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-wangqi}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
    image: wangqi/employee-management-api:1.0.0
    container_name: employee-management-api
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Override in a real deployment; the built-in default is a dev key.
      JWT_SECRET: ${JWT_SECRET:-wangqi-employee-api-dev-secret-key-change-me-in-production-0123456789}
      EXTERNAL_HR_URL: ${EXTERNAL_HR_URL:-http://localhost:1}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-wangqi}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  redis-data:
