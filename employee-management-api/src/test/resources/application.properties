# Tests must not depend on a running Redis server.
# The Redis cache manager backs off and Spring Boot provides an in-memory
# ConcurrentMapCacheManager, so the caching annotations are still exercised.
app.cache.provider=simple
spring.cache.type=simple

# Tests must not depend on a running RabbitMQ broker: the relay stays
# in-process and no listener container is started.
app.messaging.enabled=false
