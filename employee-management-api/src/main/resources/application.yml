spring:
  application:
    name: employee-management-api

  datasource:
    url: jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:wangqi}
      timeout: 2s
      connect-timeout: 2s

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:wangqi}
    password: ${RABBITMQ_PASSWORD:wangqi}
    connection-timeout: 3s
    # The broker confirms it accepted the message; a nack is logged by the publisher.
    publisher-confirm-type: correlated
    listener:
      simple:
        # A failing message goes to the dead-letter queue instead of hot-looping.
        default-requeue-rejected: false

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n"

info:
  app:
    name: employee-management-api
    author: wangqi
    description: Java 17 / Spring Boot 3 reference API

app:
  cache:
    # "redis" in production/test environments with a server; "simple" makes
    # integration tests run without Redis (in-memory ConcurrentMapCacheManager).
    provider: ${CACHE_PROVIDER:redis}
    employee-ttl: 10m
    department-ttl: 5m
  messaging:
    # false keeps the relay in-process (no broker required) — the same switch
    # the test suite uses.
    enabled: ${MESSAGING_ENABLED:true}
    exchange: employee.events
    routing-key: employee.created
    queue: employee.created.onboarding
    dead-letter-queue: employee.created.onboarding.dlq
  jwt:
    # HS256 signing key. Override with the JWT_SECRET environment variable in production.
    secret: ${JWT_SECRET:wangqi-employee-api-dev-secret-key-change-me-in-production-0123456789}
    expiration: PT1H
  demo-users:
    enabled: true
  external-hr:
    base-url: ${EXTERNAL_HR_URL:http://localhost:1}
    max-attempts: 3
    initial-backoff: 200ms
    timeout: 2s
